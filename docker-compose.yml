services:
  mysql:
    container_name: db-gold-barber
    image: mysql:8.0
    restart: always
    ports:
      - ${DATABASE_PORT}:3306
    environment:
      MYSQL_DATABASE: ${DATABASE_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
    # command: --default-authentication-plugin=mysql_native_password
